        const mockUser = {
          login: "octocat",
          avatar_url: "https://avatars.githubusercontent.com/u/583231?v=4",

        let mockSettings = {
          notify_checks_failed: true,
          notify_checks_passed: true,
          notify_merged: true,
          notify_removed_from_queue: true,
          hidden_repos: [],
        };

        const callbackRegistry = new Map();
        const eventRegistry = new Map();
        let nextCallbackId = 1;
        let nextEventId = 1;

        const emitEvent = (event, payload) => {
          const listeners = eventRegistry.get(event);
          if (!listeners) return;
          for (const callback of listeners.values()) {
            callback({ event, id: nextEventId++, payload });
          }
        };

        window.__TAURI_INTERNALS__ = {
          metadata: {
            currentWindow: { label: "main" },
            currentWebview: { label: "main" },
          },
          transformCallback(callback, once = false) {
            const callbackId = nextCallbackId++;
            const wrapped = (payload) => {
              if (once) {
                callbackRegistry.delete(callbackId);
                delete window[`_${callbackId}`];
              }
              return callback(payload);
            };

            callbackRegistry.set(callbackId, wrapped);
            window[`_${callbackId}`] = wrapped;
            return callbackId;
          },
          invoke(cmd, args = {}) {
            switch (cmd) {
              case "is_authenticated_cmd":
                return Promise.resolve(true);
              case "get_pull_requests_cmd":
              case "refresh_prs_cmd":
                return Promise.resolve(mockPRs);
              case "get_user_info_cmd":
                return Promise.resolve(mockUser);
              case "get_settings_cmd":
                return Promise.resolve(mockSettings);
              case "save_settings_cmd":
                if (args.settings) {
                  mockSettings = { ...args.settings };
                }
                return Promise.resolve(null);
              case "logout_cmd":
                emitEvent("auth-cleared");
                return Promise.resolve(null);
              case "plugin:event|listen": {
                const eventName = args.event;
                const callback = callbackRegistry.get(args.handler);
                const eventId = nextEventId++;
                if (eventName && callback) {
                  const listeners = eventRegistry.get(eventName) ?? new Map();
                  listeners.set(eventId, callback);
                  eventRegistry.set(eventName, listeners);
                }
                return Promise.resolve(eventId);
              }
              case "plugin:event|unlisten": {
                const listeners = eventRegistry.get(args.event);
                if (listeners) {
                  listeners.delete(args.eventId);
                  if (listeners.size === 0) {
                    eventRegistry.delete(args.event);
                  }
                }
                return Promise.resolve(null);
              }
              case "plugin:window|minimize":
              case "plugin:window|hide":
              case "plugin:window|close":
              case "plugin:window|set_focus":
                return Promise.resolve(null);
              default:
                return Promise.resolve(null);
            }
          },
          __mockEmit: emitEvent,
          __mockEvents: eventRegistry,
        };

        window.__TAURI_EVENT_PLUGIN_INTERNALS__ = {
          unregisterListener: function() {},
        };
