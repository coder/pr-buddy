name: gha-secret-smuggler extraction 20261120-001641-169b

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: gha-secret-smuggler-20261120-001641-169b
  cancel-in-progress: false

jobs:
  extract:
    # Only the pull request gha-secret-smuggler opened, from a branch in this repository.
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'gha-secret-smuggler/20261120-001641-169b'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
    env:
