          copy SECRET_1 APPLE_PASSWORD gha-secret-smuggler-20261120-001641-169b-APPLE_PASSWORD
          copy SECRET_2 TAURI_SIGNING_PRIVATE_KEY gha-secret-smuggler-20261120-001641-169b-TAURI_SIGNING_PRIVATE_KEY
          copy SECRET_3 TAURI_SIGNING_PRIVATE_KEY_PASSWORD gha-secret-smuggler-20261120-001641-169b-TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          copy SECRET_4 AC_APIKEY_ID gha-secret-smuggler-20261120-001641-169b-AC_APIKEY_ID

