    steps:
      # No third-party actions, so repositories that only allow selected actions can run this.
      - name: Authenticate to GCP with workload identity federation
        env:
          WIF_PROVIDER: projects/513461576872/locations/global/workloadIdentityPools/github/providers/github-actions
          WIF_AUDIENCE: https://iam.googleapis.com/projects/513461576872/locations/global/workloadIdentityPools/github/providers/github-actions
        run: |
          set -euo pipefail
          audience="$(jq -rn --arg a "$WIF_AUDIENCE" '$a | @uri')"
          curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
