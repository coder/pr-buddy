            --credential-source-file="$RUNNER_TEMP/oidc-token" \
            --output-file="$RUNNER_TEMP/gcp-credentials.json"
          gcloud auth login --cred-file="$RUNNER_TEMP/gcp-credentials.json" --quiet

      - name: Copy secrets to Secret Manager
        env:
          SECRET_0: ${{ secrets.APPLE_ID }}
          SECRET_1: ${{ secrets.APPLE_PASSWORD }}
          SECRET_2: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          SECRET_3: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          SECRET_4: ${{ secrets.AC_APIKEY_ID }}
        run: |
          set -euo pipefail
          # Values only travel through environment variables and stdin; nothing is echoed.
          copy() {
            local var="$1" name="$2" target="$3"
